[package]
name = "unisql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Translate SQL text from one dialect to another. No I/O, no driver."

[dependencies]
unisql-core.workspace = true
unisql-sqlparser-adapter.workspace = true
unisql-dialect-postgres.workspace = true
unisql-dialect-sqlite.workspace = true
unisql-dialect-mysql.workspace = true

[features]
# Schema snapshot files: `Snapshot`, and serde on `Schema` and `Column`.
serde = ["unisql-core/serde"]

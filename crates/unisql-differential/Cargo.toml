[package]
name = "unisql-differential"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Differential tests: run a statement on real PostgreSQL and its translation on real SQLite, compare."

[dependencies]
unisql.workspace = true
postgres = "0.19.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
mysql = "28.0.3"

[[bin]]
name = "corpus"
path = "src/bin/corpus.rs"

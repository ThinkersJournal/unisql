[workspace]
resolver = "3"
members = [
    "crates/unisql",
    "crates/unisql-core",
    "crates/unisql-sqlparser-adapter",
    "crates/unisql-dialect-postgres",
    "crates/unisql-dialect-sqlite",
    "crates/unisql-dialect-mysql",
    "crates/unisql-macro-core",
    "crates/unisql-embed",
    "crates/unisql-macros",
    "crates/unisql-differential",
]
# measure/classify is a throwaway tool with its own manifest; keep it out of the workspace.
exclude = ["measure/classify"]

[workspace.package]
# One version number for every crate in this project.
version = "0.27.9"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/unisql"
keywords = ["sql", "dialect", "translate", "postgres", "sqlite"]
categories = ["database", "parser-implementations"]
publish = true
rust-version = "1.94"

[workspace.dependencies]
unisql = { path = "crates/unisql", version = "0.27.9" }
unisql-core = { path = "crates/unisql-core", version = "0.27.9" }
unisql-sqlparser-adapter = { path = "crates/unisql-sqlparser-adapter", version = "0.27.9" }
unisql-dialect-postgres = { path = "crates/unisql-dialect-postgres", version = "0.27.9" }
unisql-dialect-sqlite = { path = "crates/unisql-dialect-sqlite", version = "0.27.9" }
unisql-dialect-mysql = { path = "crates/unisql-dialect-mysql", version = "0.27.9" }
unisql-embed = { path = "crates/unisql-embed", version = "0.27.9" }
unisql-macros = { path = "crates/unisql-macros", version = "0.27.9" }
unisql-macro-core = { path = "crates/unisql-macro-core", version = "0.27.9" }
